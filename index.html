<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de Segurança Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f7;
    --surface: #ffffff;
    --ink: #13203a;
    --muted: #55617a;
    --line: #d3dbe8;
    --accent: #2447e0;
    --accent-ink: #ffffff;
    --accent-soft: #e3e9fd;
    --ok: #17804f;
    --ok-soft: #dff3e8;
    --bad: #c2362c;
    --bad-soft: #fbe6e3;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1627; --surface: #18223a; --ink: #e8edf8; --muted: #9aa7c4; --line: #2b3855;
      --accent: #7f9bff; --accent-ink: #0f1627; --accent-soft: #24315a;
      --ok: #55d394; --ok-soft: #173a2b; --bad: #ff8a80; --bad-soft: #432024;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1627; --surface: #18223a; --ink: #e8edf8; --muted: #9aa7c4; --line: #2b3855;
    --accent: #7f9bff; --accent-ink: #0f1627; --accent-soft: #24315a;
    --ok: #55d394; --ok-soft: #173a2b; --bad: #ff8a80; --bad-soft: #432024;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.55; font-size: 16px; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 18px 64px; }
  h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .hero h1 { font-size: clamp(2.4rem, 9vw, 4rem); font-weight: 800; }
  .hero p { color: var(--muted); max-width: 52ch; margin: 16px 0 0; }
  .parts { list-style: none; padding: 0; margin: 28px 0; display: grid; gap: 8px; }
  .parts li { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--accent); border-radius: 6px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; }
  .parts span { color: var(--muted); font-size: .9rem; white-space: nowrap; }

  .btn { border: 0; border-radius: 8px; padding: 13px 22px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
  .seg { height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
  .seg i { position: absolute; inset: 0 auto 0 0; background: var(--accent); width: 0; transition: width .25s; }
  .meta { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: .9rem; margin-bottom: 26px; }
  .meta b { color: var(--ink); font-weight: 600; }

  .q h2 { font-size: clamp(1.4rem, 5vw, 1.9rem); font-weight: 700; margin-bottom: 20px; }
  fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
  .opt { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: border-color .15s, background .15s; }
  .opt:hover { border-color: var(--accent); }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .key { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 600; font-size: .85rem; color: var(--muted); }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:has(input:checked) .key { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
  .nav { display: flex; justify-content: space-between; margin-top: 26px; gap: 10px; }

  .score { display: flex; flex-wrap: wrap; gap: 20px; align-items: baseline; margin: 6px 0 4px; }
  .score .big { font-family: var(--display); font-weight: 800; font-size: clamp(3.4rem, 16vw, 6rem); line-height: 1; }
  .verdict { color: var(--muted); max-width: 54ch; }
  section.block { margin-top: 40px; }
  section.block > h2 { font-size: 1.5rem; margin-bottom: 16px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .overall { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; justify-content: center; }
  .overall svg { width: min(240px, 100%); height: auto; flex: none; }
  .legend { display: grid; gap: 12px; min-width: 190px; }
  .legend div { display: flex; align-items: center; gap: 10px; }
  .dot { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .legend strong { font-family: var(--display); font-size: 1.5rem; }
  .legend small { display: block; color: var(--muted); }
  .minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .mini { text-align: center; }
  .mini svg { width: 120px; height: 120px; }
  .mini h3 { font-size: 1rem; margin: 8px 0 2px; }
  .mini p { margin: 0; color: var(--muted); font-size: .9rem; }

  .miss { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--bad); border-radius: 8px; padding: 18px; margin-bottom: 14px; }
  .miss .where { color: var(--muted); font-size: .85rem; margin-bottom: 6px; }
  .miss h3 { font-size: 1.15rem; margin-bottom: 12px; }
  .ans { border-radius: 6px; padding: 9px 12px; margin-bottom: 8px; font-size: .95rem; }
  .ans.bad { background: var(--bad-soft); }
  .ans.ok { background: var(--ok-soft); }
  .ans b { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 2px; }
  .why { color: var(--muted); font-size: .95rem; margin: 10px 0 0; }
  .perfect { background: var(--ok-soft); border-radius: 10px; padding: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const PARTS = [
  { name: "Senhas e autenticação", color: "#2447e0" },
  { name: "Phishing e engenharia social", color: "#c2362c" },
  { name: "Redes e navegação segura", color: "#17804f" },
  { name: "Dispositivos, malware e backup", color: "#b7791f" },
  { name: "Privacidade e boas práticas", color: "#7a3fd1" }
];

const Q = [
  // Parte 1
  { p: 0, q: "Qual destas senhas é a mais segura?", o: ["Kaua2005!", "cavalo-bateria-grampo-lunar-47", "12345678", "senha@123"], a: 1,
    e: "Senhas longas e imprevisíveis (frases com várias palavras aleatórias) são muito mais difíceis de adivinhar do que senhas curtas com data de nascimento ou padrões comuns." },
  { p: 0, q: "O que é a autenticação em dois fatores (2FA)?", o: ["Usar duas senhas idênticas em contas diferentes", "Trocar a senha duas vezes por ano", "Exigir, além da senha, uma segunda prova de identidade", "Entrar na mesma conta em dois aparelhos"], a: 2,
    e: "O 2FA soma à senha (algo que você sabe) outro fator, como um código no app ou uma chave física (algo que você tem). Mesmo com a senha vazada, o invasor não entra sozinho." },
  { p: 0, q: "Qual é a melhor prática para lidar com dezenas de contas online?", o: ["Anotar tudo em um arquivo senhas.txt na área de trabalho", "Usar a mesma senha forte em todas", "Usar variações da mesma senha (senha1, senha2...)", "Usar um gerenciador de senhas, com uma senha única e forte por conta"], a: 3,
    e: "Senhas repetidas ou parecidas permitem que um único vazamento comprometa várias contas. O gerenciador gera e guarda senhas únicas, exigindo que você lembre só de uma senha mestra." },
  { p: 0, q: "Qual forma de 2FA costuma ser a mais resistente a ataques?", o: ["App autenticador ou chave de segurança física", "Código por SMS", "Perguntas de segurança (nome da mãe, pet...)", "Código enviado para um e-mail sem proteção extra"], a: 0,
    e: "SMS pode ser interceptado por golpes de troca de chip (SIM swap). Apps autenticadores e chaves físicas são mais difíceis de burlar." },

  // Parte 2
  { p: 1, q: "Qual é um sinal típico de mensagem de phishing?", o: ["Mensagem com seu nome completo e sem nenhum link", "E-mail do domínio oficial que não pede nada", "Urgência, ameaça de bloqueio e link suspeito pedindo seus dados", "Aviso de atualização exibido pelo próprio sistema operacional"], a: 2,
    e: "Golpistas criam pressão (\"sua conta será bloqueada hoje\") para que você aja sem pensar. Links estranhos e pedidos de dados pessoais reforçam o alerta." },
  { p: 1, q: "Você recebe um SMS do \"banco\" com um link para \"regularizar a conta\". O que fazer?", o: ["Clicar rápido para evitar o bloqueio", "Ignorar o link e entrar pelo app oficial ou ligar ao número impresso no cartão", "Responder o SMS perguntando se é verdadeiro", "Encaminhar aos amigos para avisá-los, com o link"], a: 1,
    e: "Nunca use os canais fornecidos na mensagem suspeita. Confirme sempre por um canal que você mesmo conhece e sabe ser oficial." },
  { p: 1, q: "O que é spear phishing?", o: ["Ataque de força bruta contra senhas", "Vírus que se espalha por pendrive", "Envio em massa de e-mails genéricos", "Golpe direcionado a uma pessoa ou empresa específica, com informações personalizadas"], a: 3,
    e: "No spear phishing o atacante pesquisa a vítima (cargo, colegas, fornecedores) para criar uma mensagem muito convincente, o que o torna mais perigoso que o phishing genérico." },
  { p: 1, q: "Alguém liga dizendo ser do \"suporte técnico\" e pede o código de verificação que você acabou de receber por SMS. Isso é:", o: ["Engenharia social: códigos de verificação jamais devem ser compartilhados", "Procedimento normal de suporte", "Aceitável se a pessoa souber o seu nome", "Seguro se a ligação vier de um número com DDD local"], a: 0,
    e: "Empresas legítimas não pedem códigos de verificação. Esse código é justamente o que o golpista precisa para concluir o acesso à sua conta." },

  // Parte 3
  { p: 2, q: "O cadeado (HTTPS) ao lado do endereço de um site indica que:", o: ["O site é confiável e legítimo", "A conexão com o site é criptografada, mas isso não garante que o site seja honesto", "O site está livre de vírus", "O site não coleta dados pessoais"], a: 1,
    e: "HTTPS protege os dados em trânsito. Sites de golpe também podem ter cadeado, então confira sempre o endereço exato." },
  { p: 2, q: "Você está no Wi-Fi aberto de um aeroporto e precisa acessar o banco. O mais prudente é:", o: ["Acessar normalmente, pois o cadeado garante tudo", "Desativar o firewall para conectar mais rápido", "Pedir a senha do Wi-Fi a desconhecidos", "Evitar operações sensíveis ou usar VPN/dados móveis"], a: 3,
    e: "Redes públicas podem ser monitoradas ou falsificadas (\"evil twin\"). Para operações sensíveis, prefira dados móveis ou uma VPN confiável." },
  { p: 2, q: "O que uma VPN faz de fato?", o: ["Remove vírus do aparelho", "Acelera sempre a conexão de internet", "Criptografa o tráfego até o servidor da VPN e oculta seu IP de quem está na rede local ou no site", "Torna impossível ser rastreado na internet"], a: 2,
    e: "A VPN protege o trânsito dos dados e mascara o IP, mas não elimina malwares, não impede phishing e não garante anonimato total." },
  { p: 2, q: "Qual é a forma mais segura de acessar o site do seu banco?", o: ["Digitar o endereço oficial ou usar o app oficial do banco", "Clicar no primeiro anúncio patrocinado do buscador", "Abrir o link recebido por WhatsApp", "Usar qualquer link que pareça familiar"], a: 0,
    e: "Anúncios e links recebidos podem levar a cópias fraudulentas. O endereço digitado por você ou o app oficial evitam esse risco." },

  // Parte 4
  { p: 3, q: "Por que manter o sistema e os aplicativos atualizados é importante?", o: ["As atualizações só mudam o visual", "Elas corrigem vulnerabilidades que atacantes podem explorar", "Elas deixam o aparelho mais lento de propósito", "Servem apenas para renovar a licença"], a: 1,
    e: "Muitos ataques exploram falhas já conhecidas e corrigidas. Quem não atualiza continua vulnerável a elas." },
  { p: 3, q: "O que é um ransomware?", o: ["Programa que apenas exibe propagandas", "Técnica para descobrir senhas por tentativa e erro", "Malware que criptografa seus arquivos e exige pagamento para liberá-los", "Golpe aplicado por ligação telefônica"], a: 2,
    e: "O ransomware \"sequestra\" seus dados. A melhor defesa é manter backups atualizados e desconectados, além de evitar anexos e links suspeitos." },
  { p: 3, q: "O que significa a regra de backup 3-2-1?", o: ["3 senhas, 2 fatores de autenticação e 1 antivírus", "3 cópias dos arquivos guardadas no mesmo HD", "3 backups por ano, em 2 pastas e com 1 senha", "3 cópias dos dados, em 2 tipos de mídia diferentes, com 1 cópia fora do local principal"], a: 3,
    e: "Essa distribuição reduz o risco de perder tudo por falha de hardware, roubo, incêndio ou ransomware." },
  { p: 3, q: "Qual atitude é mais segura ao instalar um aplicativo?", o: ["Baixar de qualquer site, desde que seja gratuito", "Instalar pela loja oficial e revisar as permissões que o app pede", "Instalar versões \"crackeadas\" para economizar", "Aceitar todas as permissões sem ler"], a: 1,
    e: "Lojas oficiais filtram boa parte dos apps maliciosos. Desconfie de apps que pedem permissões sem relação com sua função (como lanterna pedindo acesso aos contatos)." },

  // Parte 5
  { p: 4, q: "No Brasil, qual lei trata especificamente da proteção de dados pessoais?", o: ["Lei de Direitos Autorais", "Lei Seca", "Lei Geral de Proteção de Dados (LGPD, Lei nº 13.709/2018)", "Lei de Licitações"], a: 2,
    e: "A LGPD define como empresas e órgãos podem coletar, usar, armazenar e compartilhar dados pessoais, e garante direitos aos titulares." },
  { p: 4, q: "O que diz o princípio do menor privilégio?", o: ["Todos devem ser administradores para agilizar o trabalho", "Uma conta de administrador deve ser compartilhada pela equipe", "Nenhum usuário deve ter qualquer permissão", "Cada pessoa deve ter apenas os acessos necessários à sua função"], a: 3,
    e: "Quanto menos acessos, menor o estrago se uma conta for invadida ou usada por engano." },
  { p: 4, q: "Você perdeu o celular. Qual é a melhor primeira reação?", o: ["Esperar alguns dias para ver se ele aparece", "Bloquear ou apagar o aparelho remotamente, trocar senhas principais e avisar a operadora", "Comprar outro e deixar o antigo para lá", "Postar nas redes sociais pedindo ajuda"], a: 1,
    e: "Agir rápido limita o acesso a contas, apps bancários e mensagens. Bloquear o chip também evita golpes usando o seu número." },
  { p: 4, q: "Por que os sites devem armazenar senhas como hash (com salt), e não em texto puro?", o: ["Para economizar espaço no banco de dados", "Para poder enviar a senha original por e-mail ao usuário", "Para que um vazamento do banco não exponha diretamente as senhas", "Para tornar o login mais rápido"], a: 2,
    e: "O hash é uma transformação de mão única, e o salt dificulta ataques com tabelas prontas. Se o banco vazar, as senhas não ficam legíveis." }
];

const LETTERS = ["A", "B", "C", "D"];
const PERPART = 4;
const app = document.getElementById("app");
let cur = 0;
let answers = new Array(Q.length).fill(null);

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function start() {
  cur = 0; answers = new Array(Q.length).fill(null);
  app.innerHTML = `
    <div class="hero">
      <h1>Quiz de segurança digital</h1>
      <p>${Q.length} questões em ${PARTS.length} partes, nível básico a intermediário. Cada pergunta tem 4 alternativas e uma única resposta correta. O resultado completo, com gráficos e a explicação dos seus erros, aparece só no final.</p>
    </div>
    <ul class="parts">${PARTS.map((p, i) => `<li style="border-left-color:${p.color}"><strong>Parte ${i + 1}: ${esc(p.name)}</strong><span>${PERPART} questões</span></li>`).join("")}</ul>
    <button class="btn" id="go">Começar o quiz</button>`;
  document.getElementById("go").onclick = () => renderQ();
  window.scrollTo(0, 0);
}

function renderQ() {
  const q = Q[cur];
  const inPart = cur % PERPART;
  const segs = PARTS.map((_, i) => {
    let w = 0;
    if (i < q.p) w = 100; else if (i === q.p) w = ((inPart + (answers[cur] !== null ? 1 : 0)) / PERPART) * 100;
    return `<div class="seg"><i style="width:${w}%"></i></div>`;
  }).join("");
  const last = cur === Q.length - 1;
  app.innerHTML = `
    <div class="strip" aria-hidden="true">${segs}</div>
    <div class="meta"><span>Parte ${q.p + 1} de ${PARTS.length}: <b>${esc(PARTS[q.p].name)}</b></span><span>Questão ${inPart + 1} de ${PERPART}</span></div>
    <div class="q">
      <h2 id="qt">${esc(q.q)}</h2>
      <fieldset aria-labelledby="qt">
        ${q.o.map((t, i) => `
          <label class="opt">
            <input type="radio" name="opt" value="${i}" ${answers[cur] === i ? "checked" : ""}>
            <span class="key">${LETTERS[i]}</span><span>${esc(t)}</span>
          </label>`).join("")}
      </fieldset>
    </div>
    <div class="nav">
      <button class="btn ghost" id="back" ${cur === 0 ? "disabled" : ""}>Voltar</button>
      <button class="btn" id="next" ${answers[cur] === null ? "disabled" : ""}>${last ? "Ver resultado" : "Próxima"}</button>
    </div>`;
  app.querySelectorAll("input[name=opt]").forEach(inp => inp.onchange = () => {
    answers[cur] = Number(inp.value);
    document.getElementById("next").disabled = false;
    app.querySelectorAll(".seg i")[q.p].style.width = (((inPart + 1) / PERPART) * 100) + "%";
  });
  document.getElementById("back").onclick = () => { cur--; renderQ(); };
  document.getElementById("next").onclick = () => { if (last) renderResult(); else { cur++; renderQ(); } };
  window.scrollTo(0, 0);
}

function pie(slices, size, label) {
  const total = slices.reduce((s, x) => s + x.v, 0);
  const c = size / 2, r = size / 2 - 2;
  let body = "";
  const nonzero = slices.filter(s => s.v > 0);
  if (nonzero.length === 1) {
    body = `<circle cx="${c}" cy="${c}" r="${r}" fill="${nonzero[0].color}"/>`;
  } else {
    let ang = -Math.PI / 2;
    nonzero.forEach(s => {
      const a2 = ang + (s.v / total) * Math.PI * 2;
      const x1 = c + r * Math.cos(ang), y1 = c + r * Math.sin(ang);
      const x2 = c + r * Math.cos(a2), y2 = c + r * Math.sin(a2);
      const large = a2 - ang > Math.PI ? 1 : 0;
      body += `<path d="M${c} ${c} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
      ang = a2;
    });
  }
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}">${body}</svg>`;
}

const pct = (v, t) => (t ? Math.round((v / t) * 1000) / 10 : 0).toString().replace(".", ",") + "%";

function renderResult() {
  const OK = "#17804f", BAD = "#c2362c";
  const hits = Q.filter((q, i) => answers[i] === q.a).length;
  const miss = Q.length - hits;
  const p = (hits / Q.length) * 100;
  const verdict = p === 100 ? "Desempenho perfeito. Você domina os fundamentos e o nível intermediário de segurança digital."
    : p >= 80 ? "Muito bom. Você tem uma base sólida e só precisa ajustar alguns detalhes."
    : p >= 60 ? "Bom começo. Você conhece o básico, mas vale revisar os pontos que errou abaixo."
    : p >= 40 ? "Há lacunas importantes. Leia as explicações abaixo com atenção e tente de novo."
    : "Muita coisa para reforçar, e isso é normal para quem está começando. As explicações abaixo são o melhor ponto de partida.";

  const perPart = PARTS.map((pt, i) => {
    const idx = Q.map((q, k) => k).filter(k => Q[k].p === i);
    const h = idx.filter(k => answers[k] === Q[k].a).length;
    return { pt, h, m: idx.length - h, t: idx.length };
  });

  const misses = Q.map((q, i) => ({ q, i })).filter(({ q, i }) => answers[i] !== q.a);

  app.innerHTML = `
    <h1 style="font-size:clamp(1.6rem,6vw,2.2rem)">Seu resultado final</h1>
    <div class="score"><span class="big">${hits}/${Q.length}</span><span class="verdict">${verdict}</span></div>

    <section class="block">
      <h2>Acertos e erros no total</h2>
      <div class="panel overall">
        ${pie([{ v: hits, color: OK }, { v: miss, color: BAD }], 240, `Gráfico de pizza: ${hits} acertos e ${miss} erros`)}
        <div class="legend">
          <div><span class="dot" style="background:${OK}"></span><span><strong>${hits} acertos</strong><small>${pct(hits, Q.length)} das questões</small></span></div>
          <div><span class="dot" style="background:${BAD}"></span><span><strong>${miss} erros</strong><small>${pct(miss, Q.length)} das questões</small></span></div>
        </div>
      </div>
    </section>

    <section class="block">
      <h2>Desempenho em cada parte</h2>
      <div class="panel minis">
        ${perPart.map((x, i) => `
          <div class="mini">
            ${pie([{ v: x.h, color: OK }, { v: x.m, color: BAD }], 120, `Parte ${i + 1}: ${x.h} acertos e ${x.m} erros`)}
            <h3>Parte ${i + 1}</h3>
            <p>${esc(x.pt.name)}</p>
            <p><b style="color:var(--ok)">${x.h} certas (${pct(x.h, x.t)})</b><br><b style="color:var(--bad)">${x.m} erradas (${pct(x.m, x.t)})</b></p>
          </div>`).join("")}
      </div>
    </section>

    <section class="block">
      <h2>${misses.length ? `Questões que você errou (${misses.length})` : "Questões que você errou"}</h2>
      ${misses.length ? misses.map(({ q, i }) => `
        <article class="miss">
          <div class="where">Parte ${q.p + 1}: ${esc(PARTS[q.p].name)} · Questão ${(i % PERPART) + 1} de ${PERPART}</div>
          <h3>${esc(q.q)}</h3>
          <div class="ans bad"><b>Sua resposta</b>${LETTERS[answers[i]]}) ${esc(q.o[answers[i]])}</div>
          <div class="ans ok"><b>Resposta correta</b>${LETTERS[q.a]}) ${esc(q.o[q.a])}</div>
          <p class="why">${esc(q.e)}</p>
        </article>`).join("") : `<div class="perfect">Você não errou nenhuma questão. Nada para revisar.</div>`}
    </section>

    <div class="nav" style="justify-content:flex-start;margin-top:32px"><button class="btn" id="again">Refazer o quiz</button></div>`;
  document.getElementById("again").onclick = start;
  window.scrollTo(0, 0);
}

start();
</script>
</body>
</html>
